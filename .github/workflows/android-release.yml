name: Android release APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Optional existing GitHub Release tag to receive this build; source is the selected branch or ref
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event.release.tag_name || inputs.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build and attach APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CYBERVPN_RELEASE_KEYSTORE_BASE64: ${{ secrets.CYBERVPN_RELEASE_KEYSTORE_BASE64 }}
      CYBERVPN_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.CYBERVPN_RELEASE_KEYSTORE_PASSWORD }}
      CYBERVPN_RELEASE_KEY_ALIAS: ${{ secrets.CYBERVPN_RELEASE_KEY_ALIAS }}
      CYBERVPN_RELEASE_KEY_PASSWORD: ${{ secrets.CYBERVPN_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          if [[ -n "$RELEASE_EVENT_TAG" ]]; then
            TAG_NAME="$RELEASE_EVENT_TAG"
            if ! git check-ref-format "refs/tags/$TAG_NAME"; then
              echo "Invalid release tag: $TAG_NAME" >&2
              exit 1
            fi
            printf 'tag_name=%s\n' "$TAG_NAME" >> "$GITHUB_OUTPUT"
            printf 'source_ref=%s\n' "$TAG_NAME" >> "$GITHUB_OUTPUT"
            printf 'artifact_label=%s\n' "$TAG_NAME" >> "$GITHUB_OUTPUT"
            printf 'upload_release=true\n' >> "$GITHUB_OUTPUT"
          elif [[ -n "$INPUT_TAG" ]]; then
            if ! git check-ref-format "refs/tags/$INPUT_TAG"; then
              echo "Invalid release tag: $INPUT_TAG" >&2
              exit 1
            fi
            printf 'tag_name=%s\n' "$INPUT_TAG" >> "$GITHUB_OUTPUT"
            SOURCE_REF="${GITHUB_REF_NAME:-main}"
            printf 'source_ref=%s\n' "$SOURCE_REF" >> "$GITHUB_OUTPUT"
            printf 'artifact_label=%s-%s\n' "$SOURCE_REF" "${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
            printf 'upload_release=true\n' >> "$GITHUB_OUTPUT"
          else
            SOURCE_REF="${GITHUB_REF_NAME:-main}"
            printf 'source_ref=%s\n' "$SOURCE_REF" >> "$GITHUB_OUTPUT"
            printf 'artifact_label=%s-%s\n' "$SOURCE_REF" "${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
            printf 'upload_release=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the release source
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.source_ref }}
          fetch-depth: 0

      - name: Validate and stage the persistent release keystore
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CYBERVPN_RELEASE_KEYSTORE_BASE64
            CYBERVPN_RELEASE_KEYSTORE_PASSWORD
            CYBERVPN_RELEASE_KEY_ALIAS
            CYBERVPN_RELEASE_KEY_PASSWORD
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Actions secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/cybervpn-release-key.p12"
          printf '%s' "$CYBERVPN_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          if [[ ! -s "$KEYSTORE_FILE" ]]; then
            echo "The configured keystore secret decoded to an empty file." >&2
            exit 1
          fi
          printf 'CYBERVPN_RELEASE_STORE_FILE=%s\n' "$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Use preinstalled Android SDK and install NDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Android SDK command-line tools were not found under $SDK_ROOT." >&2
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;27.2.12479018"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        env:
          CYBERVPN_REQUIRE_RELEASE_SIGNING: "true"
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Stage APK
        shell: bash
        run: |
          APK_SOURCE="android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -s "$APK_SOURCE" ]]; then
            echo "Expected APK was not produced: $APK_SOURCE" >&2
            find android/app/build/outputs -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi
          mkdir -p release-artifacts
          cp "$APK_SOURCE" release-artifacts/CyberVPN.apk
          (cd release-artifacts && sha256sum CyberVPN.apk | tee SHA256SUMS.txt)

      - name: Attach APK to GitHub Release
        if: steps.release.outputs.upload_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" release-artifacts/CyberVPN.apk release-artifacts/SHA256SUMS.txt --repo "$RELEASE_REPOSITORY" --clobber

      - name: Upload build artifact to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: CyberVPN-${{ steps.release.outputs.artifact_label }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30
